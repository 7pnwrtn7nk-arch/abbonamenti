<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abbonamenti">
<meta name="theme-color" content="#f5f4f0">
<title>Abbonamenti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#efefeb;--text:#1a1a18;--text2:#6b6b67;--text3:#a0a09c;--accent-light:#e8e7e2;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--danger:#c94040;--danger-bg:#fdf0f0;--warn:#b06a10;--warn-bg:#fdf3e7;--ok:#2a7a4a;--ok-bg:#edf7f1;--r:14px;--r-sm:8px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--nav-h:64px;--safe-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;--text:#f0efe9;--text2:#9a9a94;--text3:#5a5a56;--accent-light:#2e2e2b;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--danger:#e06060;--danger-bg:#2d1e1e;--warn:#d08030;--warn-bg:#2d2215;--ok:#4aaa6a;--ok-bg:#162a20}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none}
#app{padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px)}
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:56px;gap:6px}
.nav-title{font-size:17px;font-weight:600;letter-spacing:-0.02em;flex:1;text-align:center}
.nav-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--surface2);color:var(--text);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-family:var(--font);font-size:11px;padding-top:8px}
.tab-btn i{font-size:22px}.tab-btn.active{color:var(--text)}
.page{display:none;padding:16px}.page.active{display:block}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1px solid var(--border);cursor:default}
.metric-label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.metric-value{font-size:22px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.metric-sub{font-size:11px;color:var(--text3);margin-top:4px}
.chart-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:16px}
.chart-card-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:14px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin:20px 0 10px}
.section-title:first-child{margin-top:0}
.sub-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative}
.sub-card:active{background:var(--surface2)}
.sub-card.paused{opacity:0.5}
.sub-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-renewal{font-size:12px;color:var(--text3);margin-top:2px}
.sub-right{text-align:right;flex-shrink:0}
.sub-cost{font-size:15px;font-weight:600;font-family:var(--mono);letter-spacing:-0.02em}
.sub-freq{font-size:11px;color:var(--text3);margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:0.02em}
.badge-urgent{background:var(--danger-bg);color:var(--danger)}
.badge-soon{background:var(--warn-bg);color:var(--warn)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-annual{background:var(--accent-light);color:var(--text2)}
.badge-paused{background:var(--surface2);color:var(--text3)}
.renewal-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
.renewal-row:last-child{border-bottom:none}
.renewal-date-box{width:42px;height:42px;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.renewal-day{font-size:16px;font-weight:600;line-height:1;font-family:var(--mono)}
.renewal-month{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-top:1px}
.renewal-info{flex:1;min-width:0}
.renewal-name{font-size:14px;font-weight:500}
.renewal-tag{font-size:11px;color:var(--text3);margin-top:4px}
.renewal-right{text-align:right;flex-shrink:0}
.renewal-amount{font-size:14px;font-weight:600;font-family:var(--mono)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:90dvh;overflow-y:auto;padding:0 0 calc(20px + var(--safe-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 16px}
.modal-header{padding:0 20px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:600;letter-spacing:-0.02em}
.modal-sub{font-size:13px;color:var(--text2);margin-top:3px}
.modal-body{padding:20px}
.modal-detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.modal-detail-row:last-child{border-bottom:none}
.modal-detail-label{font-size:13px;color:var(--text2)}
.modal-detail-value{font-size:13px;font-weight:500;text-align:right;max-width:60%}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:48px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.btn-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.btn-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;height:46px;padding:0 14px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:15px;outline:none}
.form-input:focus{border-color:var(--text)}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
select.form-input{appearance:none;-webkit-appearance:none}
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty i{font-size:48px;display:block;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:500;color:var(--text2);margin-bottom:6px}
.notif-banner{background:var(--warn-bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.notif-banner i{color:var(--warn);font-size:18px;flex-shrink:0;margin-top:1px}
.notif-text{font-size:13px;color:var(--text);line-height:1.5}
.budget-bar-wrap{background:var(--surface2);border-radius:4px;height:8px;margin-top:8px;overflow:hidden}
.budget-bar{height:100%;border-radius:4px;transition:width 0.4s}
.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;color:var(--text2)}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-row{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.sort-label{font-size:12px;color:var(--text3);flex-shrink:0}
.history-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.history-row:last-child{border-bottom:none}
.history-name{font-size:13px;font-weight:500}
.history-date{font-size:11px;color:var(--text3);margin-top:2px}
.history-amount{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--danger)}
.toggle-switch{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:13px;cursor:pointer;transition:0.2s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:white;border-radius:50%;transition:0.2s}
.toggle-switch input:checked + .toggle-slider{background:var(--ok)}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px)}
.tab-inner{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab-inner-btn{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.tab-inner-btn.active{color:var(--text);border-bottom-color:var(--text)}
.duplicate-warn{background:var(--warn-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--warn);display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <div style="display:flex;gap:6px">
      <button class="nav-btn" id="notif-btn" onclick="openNotifPanel()" aria-label="Notifiche"><i class="ti ti-bell"></i></button>
      <button class="nav-btn" onclick="openExportPanel()" aria-label="Esporta"><i class="ti ti-download"></i></button>
    </div>
    <span class="nav-title" id="nav-title">Abbonamenti</span>
    <button class="nav-btn" id="add-btn" onclick="openAddForm()" aria-label="Aggiungi"><i class="ti ti-plus"></i></button>
  </nav>

  <!-- OVERVIEW -->
  <div class="page active" id="page-overview">
    <div id="notif-container"></div>
    <div id="budget-container"></div>
    <div id="duplicate-container"></div>
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">Mensile</div><div class="metric-value" id="m-monthly">—</div><div class="metric-sub">abbonamenti attivi</div></div>
      <div class="metric"><div class="metric-label">Annuale</div><div class="metric-value" id="m-annual">—</div><div class="metric-sub">proiezione</div></div>
      <div class="metric"><div class="metric-label">Attivi</div><div class="metric-value" id="m-count">—</div><div class="metric-sub" id="m-paused-sub"></div></div>
      <div class="metric"><div class="metric-label">Più costoso</div><div class="metric-value" id="m-top" style="font-size:15px;padding-top:4px">—</div><div class="metric-sub" id="m-top-cost"></div></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">Per categoria</div>
      <div style="position:relative;height:200px"><canvas id="pieChart" role="img" aria-label="Ripartizione spese per categoria"></canvas></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>
    <div class="section-title">Prossimi rinnovi</div>
    <div id="upcoming-list"></div>
  </div>

  <!-- LIST -->
  <div class="page" id="page-list">
    <div class="filter-row" id="filter-row">
      <div class="filter-chip active" onclick="setFilter('tutti',this)">Tutti</div>
      <div class="filter-chip" onclick="setFilter('intrattenimento',this)">Intrattenimento</div>
      <div class="filter-chip" onclick="setFilter('ai',this)">AI & Prod.</div>
      <div class="filter-chip" onclick="setFilter('cloud',this)">Cloud</div>
      <div class="filter-chip" onclick="setFilter('fitness',this)">Fitness</div>
      <div class="filter-chip" onclick="setFilter('telefonia',this)">Telefonia</div>
      <div class="filter-chip" onclick="setFilter('finanza',this)">Finanza</div>
      <div class="filter-chip" onclick="setFilter('paused',this)">In pausa</div>
    </div>
    <div class="sort-row">
      <span class="sort-label">Ordina:</span>
      <select class="form-input" id="sort-select" style="height:34px;font-size:12px;padding:0 10px" onchange="renderList()">
        <option value="cat">Categoria</option>
        <option value="cost-desc">Costo ↓</option>
        <option value="cost-asc">Costo ↑</option>
        <option value="date">Prossimo rinnovo</option>
        <option value="name">Nome A-Z</option>
      </select>
    </div>
    <div id="cat-list"></div>
  </div>

  <!-- CALENDAR -->
  <div class="page" id="page-calendar">
    <div style="background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:4px 16px">
      <div id="calendar-list"></div>
    </div>
  </div>

  <!-- STORICO -->
  <div class="page" id="page-history">
    <div class="tab-inner" id="history-tabs">
      <div class="tab-inner-btn active" onclick="setHistoryTab('log',this)">Pagamenti</div>
      <div class="tab-inner-btn" onclick="setHistoryTab('chart',this)">Grafico mensile</div>
    </div>
    <div id="history-log"></div>
    <div id="history-chart-wrap" style="display:none">
      <div class="chart-card" style="margin-bottom:0">
        <div class="chart-card-title">Spesa mensile (ultimi 12 mesi)</div>
        <div style="position:relative;height:220px"><canvas id="barChart" role="img" aria-label="Grafico spesa mensile"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ADD/EDIT -->
  <div class="page" id="page-add">
    <div class="form-group"><label class="form-label">Nome servizio</label><input class="form-input" type="text" id="f-name" placeholder="es. Netflix"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Costo (€)</label><input class="form-input" type="number" id="f-cost" placeholder="9.99" step="0.01" min="0"></div>
      <div class="form-group"><label class="form-label">Frequenza</label><select class="form-input" id="f-freq"><option value="monthly">Mensile</option><option value="annual">Annuale</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Prossimo rinnovo</label><input class="form-input" type="date" id="f-date"></div>
    <div class="form-group"><label class="form-label">Categoria</label><select class="form-input" id="f-cat"><option value="intrattenimento">Intrattenimento</option><option value="ai">AI & Produttività</option><option value="cloud">Cloud & Utility</option><option value="fitness">Fitness & Salute</option><option value="telefonia">Telefonia</option><option value="finanza">Finanza</option><option value="altro">Altro</option></select></div>
    <div class="form-group">
      <label class="form-label">Notifica anticipata</label>
      <select class="form-input" id="f-notif-days">
        <option value="1">1 giorno prima</option>
        <option value="3">3 giorni prima</option>
        <option value="7">7 giorni prima</option>
        <option value="0">Nessuna</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Colore icona</label><div class="color-picker-row" id="color-picker"></div></div>
    <div class="form-group"><label class="form-label">Icona</label><select class="form-input" id="f-icon"><option value="ti-device-tv">TV / Streaming</option><option value="ti-music">Musica</option><option value="ti-ball-football">Sport</option><option value="ti-brain">AI / Assistente</option><option value="ti-robot">Chatbot</option><option value="ti-microphone">Trascrizione</option><option value="ti-pencil">Design / Grafica</option><option value="ti-cloud">Cloud Storage</option><option value="ti-brand-apple">Apple</option><option value="ti-brand-google">Google</option><option value="ti-camera">Sicurezza</option><option value="ti-apple">Salute / Cibo</option><option value="ti-moon">Meditazione</option><option value="ti-phone">Telefonia</option><option value="ti-credit-card">Finanza / Banca</option><option value="ti-shopping-bag">Shopping</option><option value="ti-star">Altro</option></select></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn" onclick="cancelAdd()">Annulla</button>
      <button class="btn btn-primary" onclick="saveSub()">Salva</button>
    </div>
    <div id="delete-container" style="margin-top:12px;display:none;gap:10px;flex-direction:column">
      <button class="btn btn-warn" style="width:100%" id="pause-btn" onclick="togglePause()"><i class="ti ti-player-pause"></i> <span id="pause-label">Metti in pausa</span></button>
      <button class="btn btn-danger" style="width:100%" onclick="deleteCurrentSub()"><i class="ti ti-trash"></i> Elimina abbonamento</button>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="showPage('overview',0)" aria-label="Riepilogo"><i class="ti ti-chart-pie"></i><span>Riepilogo</span></button>
  <button class="tab-btn" onclick="showPage('list',1)" aria-label="Lista"><i class="ti ti-list"></i><span>Lista</span></button>
  <button class="tab-btn" onclick="showPage('calendar',2)" aria-label="Rinnovi"><i class="ti ti-calendar-event"></i><span>Rinnovi</span></button>
  <button class="tab-btn" onclick="showPage('history',3)" aria-label="Storico"><i class="ti ti-history"></i><span>Storico</span></button>
</nav>

<script>
const CAT_COLORS={intrattenimento:'#D85A30',ai:'#7F77DD',cloud:'#378ADD',fitness:'#1D9E75',telefonia:'#BA7517',finanza:'#888780',altro:'#5DCAA5'};
const CAT_LABELS={intrattenimento:'Intrattenimento',ai:'AI & Produttività',cloud:'Cloud & Utility',fitness:'Fitness & Salute',telefonia:'Telefonia',finanza:'Finanza',altro:'Altro'};
const ICON_COLORS=[{bg:'#FAECE7',fg:'#D85A30'},{bg:'#EEEDFE',fg:'#534AB7'},{bg:'#E6F1FB',fg:'#185FA5'},{bg:'#E1F5EE',fg:'#0F6E56'},{bg:'#FAEEDA',fg:'#854F0B'},{bg:'#F1EFE8',fg:'#5F5E5A'},{bg:'#FBEAF0',fg:'#993556'},{bg:'#EAF3DE',fg:'#3B6D11'}];
const CAT_SIMILAR={intrattenimento:['streaming','tv','film'],ai:['ai','assistente'],cloud:['storage','cloud']};

const DEFAULTS=[
  {id:'1',name:'Netflix Premium',cost:19.99,freq:'monthly',renewal:'2026-06-16',cat:'intrattenimento',icon:'ti-device-tv',colorIdx:0,notifDays:1,paused:false},
  {id:'2',name:'Amazon Prime',cost:49.90,freq:'annual',renewal:'2026-07-07',cat:'intrattenimento',icon:'ti-shopping-bag',colorIdx:0,notifDays:1,paused:false},
  {id:'3',name:'DAZN Full',cost:52.49,freq:'monthly',renewal:'2026-06-25',cat:'intrattenimento',icon:'ti-ball-football',colorIdx:0,notifDays:1,paused:false},
  {id:'4',name:'Wind (personale)',cost:15.98,freq:'monthly',renewal:'2026-06-05',cat:'telefonia',icon:'ti-phone',colorIdx:4,notifDays:1,paused:false},
  {id:'5',name:'Yazio Pro',cost:29.90,freq:'annual',renewal:'2026-05-22',cat:'fitness',icon:'ti-apple',colorIdx:3,notifDays:1,paused:false},
  {id:'6',name:'Apple One Famiglia',cost:25.95,freq:'monthly',renewal:'2026-05-30',cat:'cloud',icon:'ti-brand-apple',colorIdx:2,notifDays:1,paused:false},
  {id:'7',name:'Balance Meditation',cost:44.99,freq:'annual',renewal:'2026-07-27',cat:'fitness',icon:'ti-moon',colorIdx:3,notifDays:1,paused:false},

function load(k){try{const r=localStorage.getItem(k);if(r)return r}catch(e){}try{const r=sessionStorage.getItem(k);if(r)return r}catch(e){}return null;}

function monthlyEq(s){return s.freq==='monthly'?s.cost:s.cost/12;}
function daysUntil(ds){const t=new Date();t.setHours(0,0,0,0);const d=new Date(ds);d.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
const MS=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MF=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function fmtS(ds){const d=new Date(ds);return d.getDate()+' '+MS[d.getMonth()];}
function fmtF(ds){const d=new Date(ds);return d.getDate()+' '+MF[d.getMonth()]+' '+d.getFullYear();}
function badge(days,freq,paused){
  if(paused)return '<span class="badge badge-paused">in pausa</span>';
  if(freq==='annual')return '<span class="badge badge-annual">annuale</span>';
  if(days<0)return '<span class="badge badge-urgent">scaduto</span>';
  if(days===0)return '<span class="badge badge-urgent">oggi</span>';
  if(days<=7)return '<span class="badge badge-urgent">'+days+'g</span>';
  if(days<=14)return '<span class="badge badge-soon">'+days+'g</span>';
  return '<span class="badge badge-ok">'+days+'g</span>';
}

// Auto-aggiorna date di rinnovo scadute
function autoRenewDates(){
  let changed=false;
  const today=new Date();today.setHours(0,0,0,0);
  subs.forEach(s=>{
    if(s.paused)return;
    const d=new Date(s.renewal);d.setHours(0,0,0,0);
    if(d<today){
      // Registra nel storico
      history.push({id:Date.now().toString()+Math.random(),subId:s.id,name:s.name,amount:s.cost,date:s.renewal,cat:s.cat});
      // Avanza data
      if(s.freq==='monthly'){d.setMonth(d.getMonth()+1);}
      else{d.setFullYear(d.getFullYear()+1);}
      s.renewal=d.toISOString().split('T')[0];
      changed=true;
    }
  });
  if(changed)saveAll();
}
autoRenewDates();

// Rileva duplicati (stessa categoria con costi simili)
function findDuplicates(){
  const dups=[];
  const active=subs.filter(s=>!s.paused);
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      const a=active[i],b=active[j];
      if(a.cat===b.cat){
        const diff=Math.abs(monthlyEq(a)-monthlyEq(b));
        const avg=(monthlyEq(a)+monthlyEq(b))/2;
        if(diff/avg<0.5&&avg>2){dups.push([a.name,b.name]);}
      }
    }
  }
  return dups;
}

  });

  // Prossimi rinnovi

  const pl=document.getElementById('pause-label');
  pb.className='btn '+(s.paused?'btn-ok':'btn-warn');
  pl.textContent=s.paused?'Riattiva abbonamento':'Metti in pausa';
}

function deleteCurrentSub(){
  if(!editingId)return;
  const s=subs.find(x=>x.id===editingId);
  if(s&&confirm('Eliminare "'+s.name+'"?')){subs=subs.filter(x=>x.id!==editingId);saveAll();renderAll();editingId=null;cancelAdd();}
}

// ── ESPORTA ────────────────────────────────────────────────────
function openExportPanel(){
  const ov=document.createElement('div');ov.className='modal-overlay open';ov.id='export-ov';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal"><div class="modal-handle"></div><div class="modal-header"><div class="modal-title">Esporta dati</div><div class="modal-sub">Scarica i tuoi abbonamenti</div></div><div class="modal-body"><div class="modal-actions" style="flex-direction:column"><button class="btn btn-primary" onclick="exportCSV()"><i class="ti ti-file-type-csv"></i> Esporta come CSV</button><button class="btn" onclick="exportJSON()" style="margin-top:10px"><i class="ti ti-file-type-json"></i> Esporta come JSON (backup)</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="document.getElementById(\'export-ov\').remove()">Chiudi</button></div></div>';
  document.body.appendChild(ov);
}

function exportCSV(){
  const active=subs.filter(s=>!s.paused);
  const rows=[['Nome','Costo','Frequenza','Mensile','Prossimo rinnovo','Categoria']];
  active.forEach(s=>rows.push([s.name,s.cost.toFixed(2),s.freq==='monthly'?'Mensile':'Annuale',monthlyEq(s).toFixed(2),s.renewal,CAT_LABELS[s.cat]||s.cat]));
  const total=active.reduce((a,s)=>a+monthlyEq(s),0);
  rows.push([]);rows.push(['TOTALE MENSILE','','',''+total.toFixed(2),'','']);
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  download('abbonamenti.csv','data:text/csv;charset=utf-8,'+encodeURIComponent(csv));
}

function exportJSON(){
  download('abbonamenti_backup.json','data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({subs,history},null,2)));
}

function download(filename,dataUrl){
  const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.click();
}

// ── BUDGET ────────────────────────────────────────────────────
function openNotifPanel(){
  const supported='Notification' in window;
  const permLabel=!supported?'Non supportato':Notification.permission==='granted'?'✅ Abilitato':Notification.permission==='denied'?'❌ Bloccato':'⏳ Non richiesto';
  const ov=document.createElement('div');ov.className='modal-overlay open';ov.id='notif-ov';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal"><div class="modal-handle"></div><div class="modal-header"><div class="modal-title">Impostazioni</div></div><div class="modal-body"><div style="font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px">Notifiche</div><div class="modal-detail-row"><span class="modal-detail-label">Permesso browser</span><span class="modal-detail-value">'+permLabel+'</span></div><div class="modal-detail-row" style="flex-direction:column;align-items:flex-start;gap:10px"><span class="modal-detail-label">Attiva notifiche push</span><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><span class="toggle-switch"><input type="checkbox" id="notif-toggle" '+(settings.enabled?'checked':'')+' ><span class="toggle-slider"></span></span><span style="font-size:14px">Avviso '+(settings.daysBefore||1)+' giorno/i prima</span></label></div><div style="font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;margin:16px 0 12px">Budget mensile</div><div class="modal-detail-row" style="flex-direction:column;align-items:flex-start;gap:10px"><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><span class="toggle-switch"><input type="checkbox" id="budget-toggle" '+(budget.enabled?'checked':'')+' ><span class="toggle-slider"></span></span><span style="font-size:14px">Attiva budget</span></label><input class="form-input" type="number" id="budget-amount" value="'+(budget.amount||300)+'" placeholder="es. 300" min="0" style="margin-top:4px"></div><div class="modal-actions" style="margin-top:20px"><button class="btn" onclick="document.getElementById(\'notif-ov\').remove()">Chiudi</button><button class="btn btn-primary" onclick="saveSettings()">Salva</button></div><div style="margin-top:12px"><button class="btn" style="width:100%;color:var(--text2)" onclick="testNotif()"><i class="ti ti-bell"></i> Notifica di prova</button></div></div></div>';
  document.body.appendChild(ov);
}

async function saveSettings(){
  const toggle=document.getElementById('notif-toggle');
  const bt=document.getElementById('budget-toggle');
  const ba=document.getElementById('budget-amount');
  if(toggle&&toggle.checked&&Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted'){toggle.checked=false;}
  }
  settings.enabled=toggle?toggle.checked:false;
  settings.lastCheck=null;
  budget.enabled=bt?bt.checked:false;
  budget.amount=ba?parseFloat(ba.value)||0:0;
  saveAll();
  document.getElementById('notif-ov')?.remove();
  updateNotifBtn();renderAll();
  if(settings.enabled)checkNotifs();
}

function sendNotif(title,body){
  if(Notification.permission!=='granted')return;
  try{new Notification(title,{body});}catch(e){}
}

async function testNotif(){
  if('Notification' in window&&Notification.permission!=='granted')await Notification.requestPermission();
  sendNotif('🔔 Notifica di prova','Le notifiche per Abbonamenti funzionano!');
}

function checkNotifs(){
  if(!settings.enabled||Notification.permission!=='granted')return;
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=today.toISOString().split('T')[0];
  if(settings.lastCheck===todayStr)return;
  subs.filter(s=>!s.paused).forEach(s=>{
    const days=daysUntil(s.renewal);
    const nd=s.notifDays||1;
    if(days>=0&&days<=nd){sendNotif('🔔 Rinnovo imminente',s.name+' si rinnova tra '+days+' giorno/i — €'+s.cost.toFixed(2));}
  });
  settings.lastCheck=todayStr;saveAll();
}

function updateNotifBtn(){
  const btn=document.getElementById('notif-btn');if(!btn)return;
  btn.style.color=settings.enabled&&Notification.permission==='granted'?'var(--ok)':'var(--text)';
}

updateNotifBtn();
checkNotifs();
renderAll();
</script>
</body>
</html>
