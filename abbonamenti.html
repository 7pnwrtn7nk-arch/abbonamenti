<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abbonamenti">
<meta name="theme-color" content="#f5f4f0">
<title>Abbonamenti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- tabler icons removed, using emoji -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f5f4f0; --sur:#fff; --sur2:#efefeb; --tx:#1a1a18; --tx2:#6b6b67; --tx3:#a0a09c;
  --bor:rgba(0,0,0,.08); --bor2:rgba(0,0,0,.14);
  --red:#c94040; --redbg:#fdf0f0; --ora:#b06a10; --orabg:#fdf3e7;
  --grn:#2a7a4a; --grnbg:#edf7f1; --acc:#e8e7e2;
  --r:14px; --rsm:8px; --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --navh:64px; --safe:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18; --sur:#242422; --sur2:#2e2e2b; --tx:#f0efe9; --tx2:#9a9a94; --tx3:#5a5a56;
  --bor:rgba(255,255,255,.08); --bor2:rgba(255,255,255,.14);
  --red:#e06060; --redbg:#2d1e1e; --ora:#d08030; --orabg:#2d2215;
  --grn:#4aaa6a; --grnbg:#162a20; --acc:#2e2e2b;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100dvh;overscroll-behavior:none}
#app{padding-bottom:calc(var(--navh) + var(--safe) + 16px)}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--bor);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:56px;gap:8px}
.nav-title{font-size:17px;font-weight:600;letter-spacing:-.02em;flex:1;text-align:center}
.nav-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--sur2);color:var(--tx);
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* TAB BAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--navh) + var(--safe));
  padding-bottom:var(--safe);background:var(--sur);border-top:1px solid var(--bor);display:flex;z-index:100}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;color:var(--tx3);font-family:var(--font);font-size:11px;padding-top:8px}
.tabbtn i{font-size:22px}
.tabbtn.on{color:var(--tx)}

/* PAGES */
.page{display:none;padding:16px}
.page.on{display:block}

/* METRICS */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{background:var(--sur);border-radius:var(--r);padding:14px 16px;border:1px solid var(--bor)}
.mlabel{font-size:11px;color:var(--tx2);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.mval{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.msub{font-size:11px;color:var(--tx3);margin-top:4px}

/* CARDS */
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bor);padding:16px;margin-bottom:16px}
.ctitle{font-size:13px;font-weight:500;color:var(--tx2);margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ldot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.litem{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}

/* SECTION TITLE */
.stitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:20px 0 10px}
.stitle:first-child{margin-top:0}

/* SUB CARD */
.subcard{background:var(--sur);border-radius:var(--r);border:1px solid var(--bor);
  display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.subcard:active{background:var(--sur2)}
.subcard.paused{opacity:.45}
.sicon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.sname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:12px;color:var(--tx3);margin-top:2px}
.sright{text-align:right;flex-shrink:0}
.scost{font-size:15px;font-weight:600;font-family:var(--mono)}
.sfreq{font-size:11px;color:var(--tx3);margin-top:2px}

/* BADGE */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.bred{background:var(--redbg);color:var(--red)}
.bora{background:var(--orabg);color:var(--ora)}
.bgrn{background:var(--grnbg);color:var(--grn)}
.bgry{background:var(--acc);color:var(--tx2)}

/* RENEWAL ROW */
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bor);cursor:pointer}
.rrow:last-child{border-bottom:none}
.rdbox{width:42px;height:42px;border-radius:10px;background:var(--sur2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.rday{font-size:16px;font-weight:600;line-height:1;font-family:var(--mono)}
.rmon{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-top:1px}
.rinfo{flex:1;min-width:0}
.rname{font-size:14px;font-weight:500}
.rtag{margin-top:4px}
.ramount{font-size:14px;font-weight:600;font-family:var(--mono);text-align:right}
.rfreq{font-size:11px;color:var(--tx3);text-align:right;margin-top:2px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.overlay.on{display:flex}
.modal{background:var(--sur);border-radius:20px 20px 0 0;width:100%;max-height:90dvh;overflow-y:auto;
  padding:0 0 calc(24px + var(--safe))}
.mhandle{width:36px;height:4px;background:var(--bor2);border-radius:2px;margin:12px auto 16px}
.mhead{padding:0 20px 16px;border-bottom:1px solid var(--bor)}
.mtitle{font-size:18px;font-weight:600;letter-spacing:-.02em}
.msub2{font-size:13px;color:var(--tx2);margin-top:3px}
.mbody{padding:20px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bor)}
.drow:last-child{border-bottom:none}
.dlabel{font-size:13px;color:var(--tx2)}
.dval{font-size:13px;font-weight:500;text-align:right}
.mactions{display:flex;gap:10px;margin-top:20px}

/* BUTTONS */
.btn{flex:1;height:48px;border-radius:var(--rsm);border:1px solid var(--bor2);background:var(--sur2);
  color:var(--tx);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.bpri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.bred2{background:var(--redbg);color:var(--red);border-color:transparent}
.bora2{background:var(--orabg);color:var(--ora);border-color:transparent}
.bgrn2{background:var(--grnbg);color:var(--grn);border-color:transparent}

/* FORM */
.fgroup{margin-bottom:16px}
.flabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);margin-bottom:6px;display:block}
.finput{width:100%;height:46px;padding:0 14px;border:1px solid var(--bor2);border-radius:var(--rsm);
  background:var(--sur2);color:var(--tx);font-family:var(--font);font-size:15px;outline:none}
.finput:focus{border-color:var(--tx)}
select.finput{appearance:none;-webkit-appearance:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cpick{display:flex;gap:8px;flex-wrap:wrap}
.cdot{width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}

/* FILTER */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--bor2);
  background:var(--sur);font-size:12px;font-weight:500;cursor:pointer;color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sortrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.slabel{font-size:12px;color:var(--tx3);flex-shrink:0}

/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calmonth{font-size:17px;font-weight:600;letter-spacing:-.02em}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;text-align:center}
.caldow span{font-size:11px;font-weight:600;color:var(--tx3)}
.caldow span:last-child{color:var(--red)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:20px}
.calday{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:46px;border-radius:10px;cursor:default;padding:4px 2px}
.calday.has{cursor:pointer}
.calday.has:active{background:var(--sur2)}
.calday.today{background:var(--sur2)}
.calday.sel{background:var(--tx)}
.caldaynum{font-size:15px;line-height:1.2}
.calday.sel .caldaynum{color:var(--bg)}
.calday.sun .caldaynum{color:var(--red)}
.calday.sel .caldaynum{color:var(--bg) !important}
.caldots{display:flex;gap:2px;margin-top:2px}
.caldot{width:5px;height:5px;border-radius:50%}
.calday.sel .caldot{background:var(--bg) !important}
.caldetail{background:var(--sur);border-radius:var(--r);border:1px solid var(--bor);overflow:hidden;margin-bottom:16px}
.caldetail-hd{padding:12px 16px;border-bottom:1px solid var(--bor);font-size:13px;font-weight:600;color:var(--tx2)}

/* HISTORY */
.innertabs{display:flex;border-bottom:1px solid var(--bor);margin-bottom:16px}
.itab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent}
.itab.on{color:var(--tx);border-bottom-color:var(--tx)}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bor)}
.hrow:last-child{border-bottom:none}
.hname{font-size:13px;font-weight:500}
.hdate{font-size:11px;color:var(--tx3);margin-top:2px}
.hamount{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--red)}

/* BANNERS */
.banner{border-radius:var(--rsm);padding:12px 14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.bannericon{font-size:18px;flex-shrink:0;margin-top:1px}
.bannertext{font-size:13px;line-height:1.5;flex:1}

/* BUDGET BAR */
.budgetbar{height:8px;border-radius:4px;background:var(--sur2);margin-top:6px;overflow:hidden}
.budgetfill{height:100%;border-radius:4px;transition:width .4s}

/* TOGGLE */
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--bor2);border-radius:13px;cursor:pointer;transition:.2s}
.tslider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked + .tslider{background:var(--grn)}
.toggle input:checked + .tslider:before{transform:translateX(18px)}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--tx3)}
.empty i{font-size:48px;display:block;margin-bottom:12px}
.empty-t{font-size:16px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.empty-s{font-size:13px}
</style>

</head>
<body>
<div id="app">

  <!-- NAV -->
  <nav class="nav">
    <div style="display:flex;gap:6px">
      <button class="nav-btn" id="notifbtn" onclick="openSettings()" title="Impostazioni"><span style="font-size:inherit;">⚙</span></button>
      <button class="nav-btn" onclick="openExport()" title="Esporta"><span style="font-size:inherit;">↓</span></button>
    </div>
    <span class="nav-title" id="navtitle">Abbonamenti</span>
    <button class="nav-btn" id="addbtn" onclick="openAdd()" title="Aggiungi"><span style="font-size:inherit;">+</span></button>
  </nav>

  <!-- PAGE: OVERVIEW -->
  <div class="page on" id="pg-overview">
    <div class="mgrid">
      <div class="metric"><div class="mlabel">Mensile</div><div class="mval" id="mv-monthly">—</div><div class="msub">spesa attiva</div></div>
      <div class="metric"><div class="mlabel">Annuale</div><div class="mval" id="mv-annual">—</div><div class="msub">proiezione</div></div>
      <div class="metric"><div class="mlabel">Attivi</div><div class="mval" id="mv-count">—</div><div class="msub" id="mv-paused"></div></div>
      <div class="metric"><div class="mlabel">Più costoso</div><div class="mval" id="mv-top" style="font-size:15px;padding-top:4px">—</div><div class="msub" id="mv-topcost"></div></div>
    </div>
    <div id="alertbox"></div>
    <div class="card">
      <div class="ctitle">Per categoria</div>
      <div style="position:relative;height:200px"><canvas id="piechart"></canvas></div>
      <div class="legend" id="pielegend"></div>
    </div>
    <div class="stitle">Prossimi rinnovi</div>
    <div id="upcoming"></div>
  </div>

  <!-- PAGE: LIST -->
  <div class="page" id="pg-list">
    <div class="filters" id="filterrow"></div>
    <div class="sortrow">
      <span class="slabel">Ordina:</span>
      <select class="finput" id="sortsel" style="height:34px;font-size:12px;padding:0 10px" onchange="drawList()">
        <option value="cat">Categoria</option>
        <option value="cost">Costo ↓</option>
        <option value="date">Prossimo rinnovo</option>
        <option value="name">Nome A–Z</option>
      </select>
    </div>
    <div id="listcont"></div>
  </div>

  <!-- PAGE: CALENDAR -->
  <div class="page" id="pg-calendar">
    <div class="calhead">
      <button class="nav-btn" onclick="calMove(-1)"><span style="font-size:inherit;">‹</span></button>
      <span class="calmonth" id="calmonth"></span>
      <button class="nav-btn" onclick="calMove(1)"><span style="font-size:inherit;">›</span></button>
    </div>
    <div class="caldow">
      <span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="calgrid" id="calgrid"></div>
    <div id="caldetail"></div>
  </div>

  <!-- PAGE: HISTORY -->
  <div class="page" id="pg-history">
    <div class="innertabs">
      <div class="itab on" id="itab-log" onclick="switchHistTab('log')">Pagamenti</div>
      <div class="itab" id="itab-chart" onclick="switchHistTab('chart')">Grafico mensile</div>
    </div>
    <div id="histlog"></div>
    <div id="histchart" style="display:none">
      <div class="card" style="margin-bottom:0">
        <div class="ctitle">Spesa mensile — ultimi 12 mesi</div>
        <div style="position:relative;height:220px"><canvas id="barchart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- PAGE: ADD/EDIT -->
  <div class="page" id="pg-add">
    <div class="fgroup"><label class="flabel">Nome servizio</label><input class="finput" id="f-name" type="text" placeholder="es. Netflix"></div>
    <div class="frow">
      <div class="fgroup"><label class="flabel">Costo (€)</label><input class="finput" id="f-cost" type="number" placeholder="9.99" step="0.01" min="0"></div>
      <div class="fgroup"><label class="flabel">Frequenza</label>
        <select class="finput" id="f-freq"><option value="monthly">Mensile</option><option value="annual">Annuale</option></select>
      </div>
    </div>
    <div class="fgroup"><label class="flabel">Prossimo rinnovo</label><input class="finput" id="f-date" type="date"></div>
    <div class="fgroup"><label class="flabel">Categoria</label>
      <select class="finput" id="f-cat">
        <option value="int">Intrattenimento</option><option value="ai">AI & Produttività</option>
        <option value="cloud">Cloud & Utility</option><option value="fit">Fitness & Salute</option>
        <option value="tel">Telefonia</option><option value="fin">Finanza</option><option value="alt">Altro</option>
      </select>
    </div>
    <div class="fgroup"><label class="flabel">Notifica anticipata</label>
      <select class="finput" id="f-notif"><option value="1">1 giorno prima</option><option value="3">3 giorni prima</option><option value="7">7 giorni prima</option><option value="0">Nessuna</option></select>
    </div>
    <div class="fgroup"><label class="flabel">Colore</label><div class="cpick" id="cpick"></div></div>
    <div class="fgroup"><label class="flabel">Icona</label>
      <select class="finput" id="f-icon">
        <option value="ti-device-tv">TV / Streaming</option><option value="ti-music">Musica</option>
        <option value="ti-ball-football">Sport</option><option value="ti-brain">AI / Assistente</option>
        <option value="ti-robot">Chatbot</option><option value="ti-microphone">Trascrizione</option>
        <option value="ti-pencil">Design / Grafica</option><option value="ti-cloud">Cloud Storage</option>
        <option value="ti-brand-apple">Apple</option><option value="ti-brand-google">Google</option>
        <option value="ti-camera">Sicurezza</option><option value="ti-apple">Salute / Cibo</option>
        <option value="ti-moon">Meditazione</option><option value="ti-phone">Telefonia</option>
        <option value="ti-credit-card">Finanza / Banca</option><option value="ti-shopping-bag">Shopping</option>
        <option value="ti-star">Altro</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn" onclick="cancelAdd()">Annulla</button>
      <button class="btn bpri" onclick="saveSub()">Salva</button>
    </div>
    <div id="editbtns" style="margin-top:12px;display:none;flex-direction:column;gap:10px">
      <button class="btn bora2" id="pausebtn" onclick="togglePause()" style="width:100%"><span style="font-size:inherit;">⏸</span> <span id="pauselbl">Metti in pausa</span></button>
      <button class="btn bred2" onclick="deleteSub()" style="width:100%"><span style="font-size:inherit;">🗑</span> Elimina abbonamento</button>
    </div>
  </div>

</div><!-- /app -->

<!-- TAB BAR -->
<nav class="tabbar">
  <button class="tabbtn on" onclick="showPage('overview',0)" aria-label="Riepilogo"><span style="font-size:inherit;">◑</span><span>Riepilogo</span></button>
  <button class="tabbtn" onclick="showPage('list',1)" aria-label="Lista"><span style="font-size:inherit;">≡</span><span>Lista</span></button>
  <button class="tabbtn" onclick="showPage('calendar',2)" aria-label="Rinnovi"><span style="font-size:inherit;">📅</span><span>Rinnovi</span></button>
  <button class="tabbtn" onclick="showPage('history',3)" aria-label="Storico"><span style="font-size:inherit;">↺</span><span>Storico</span></button>
</nav>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CATCOL = {int:'#D85A30',ai:'#7F77DD',cloud:'#378ADD',fit:'#1D9E75',tel:'#BA7517',fin:'#888780',alt:'#5DCAA5'};
const CATLBL = {int:'Intrattenimento',ai:'AI & Produttività',cloud:'Cloud & Utility',fit:'Fitness & Salute',tel:'Telefonia',fin:'Finanza',alt:'Altro'};
const ICONCOL = [
  {bg:'#FAECE7',fg:'#D85A30'},{bg:'#EEEDFE',fg:'#534AB7'},{bg:'#E6F1FB',fg:'#185FA5'},
  {bg:'#E1F5EE',fg:'#0F6E56'},{bg:'#FAEEDA',fg:'#854F0B'},{bg:'#F1EFE8',fg:'#5F5E5A'},
  {bg:'#FBEAF0',fg:'#993556'},{bg:'#EAF3DE',fg:'#3B6D11'}
];
const MSSHORT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MSLONG  = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

// ─── DATA ────────────────────────────────────────────────────────────────────
const DEFAULTS = [
  {id:'1', name:'Netflix Premium',    cost:19.99, freq:'monthly', renewal:'2026-06-16', cat:'int',   icon:'ti-device-tv',     ci:0, nd:1, paused:false},
  {id:'2', name:'Amazon Prime',       cost:49.90, freq:'annual',  renewal:'2026-07-07', cat:'int',   icon:'ti-shopping-bag',  ci:0, nd:1, paused:false},
  {id:'3', name:'DAZN Full',          cost:52.49, freq:'monthly', renewal:'2026-06-25', cat:'int',   icon:'ti-ball-football', ci:0, nd:1, paused:false},

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function mthly(s){ return s.freq==='monthly' ? s.cost : s.cost/12; }
function daysTo(ds){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(ds); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function fmtShort(ds){ const d=new Date(ds); return d.getDate()+' '+MSSHORT[d.getMonth()]; }
function fmtLong(ds){ const d=new Date(ds); return d.getDate()+' '+MSLONG[d.getMonth()]+' '+d.getFullYear(); }

function badge(s){
  if(s.paused) return '<span class="badge bgry">in pausa</span>';
  if(s.freq==='annual') return '<span class="badge bgry">annuale</span>';
  const d=daysTo(s.renewal);
  if(d<0)  return '<span class="badge bred">scaduto</span>';
  if(d===0) return '<span class="badge bred">oggi</span>';
  if(d<=7)  return '<span class="badge bred">'+d+'g</span>';
  if(d<=14) return '<span class="badge bora">'+d+'g</span>';
  return '<span class="badge bgrn">'+d+'g</span>';
}

// Auto-advance expired renewals & log payment
function autoAdvance(){
  const today=new Date(); today.setHours(0,0,0,0);
  let changed=false;
  subs.forEach(s=>{
    if(s.paused) return;
    const d=new Date(s.renewal); d.setHours(0,0,0,0);
    if(d<today){
      paylog.push({id:Date.now()+''+Math.random(), subId:s.id, name:s.name, amount:s.cost, date:s.renewal, cat:s.cat});
      if(s.freq==='monthly') d.setMonth(d.getMonth()+1);
      else d.setFullYear(d.getFullYear()+1);
      s.renewal=d.toISOString().split('T')[0];
      changed=true;
    }
  });
  if(changed) saveAll();
}
autoAdvance();

// Detect possible duplicates (same category, similar cost)
function findDups(){
  const active=subs.filter(s=>!s.paused);
  const pairs=[];
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      const a=active[i], b=active[j];
      if(a.cat!==b.cat) continue;
      // Only flag if same icon (same type of service) AND costs similar
      const sameIcon = a.icon===b.icon;
      const diff=Math.abs(mthly(a)-mthly(b));
      const avg=(mthly(a)+mthly(b))/2;
      const verySimilarCost = avg>1 && diff/avg<0.1; // within 10%
      if(sameIcon || verySimilarCost) pairs.push([a.id+'_'+b.id, a.name, b.name]);
    }
  }
  return pairs;
}

  curFilter=f;

function drawList(){
  buildFilters();
  const sort=document.getElementById('sortsel').value;
  let arr=subs.filter(s=>{
    if(curFilter==='tutti') return !s.paused;
    if(curFilter==='paused') return s.paused;
    return s.cat===curFilter && !s.paused;
  });
  if(sort==='cost') arr=[...arr].sort((a,b)=>mthly(b)-mthly(a));
  else if(sort==='date') arr=[...arr].sort((a,b)=>new Date(a.renewal)-new Date(b.renewal));
  else if(sort==='name') arr=[...arr].sort((a,b)=>a.name.localeCompare(b.name));
  else { // cat
    const ord=['int','ai','cloud','fit','tel','fin','alt'];
    arr=[...arr].sort((a,b)=>ord.indexOf(a.cat)-ord.indexOf(b.cat));
  }
  if(!arr.length){ document.getElementById('listcont').innerHTML='<div class="empty"><span style="font-size:inherit;">📥</span><div class="empty-t">Nessun abbonamento</div></div>'; return; }
  let html='', lastCat='';
  arr.forEach(s=>{
    if(sort==='cat' && curFilter==='tutti' && s.cat!==lastCat){
      html+='<div class="stitle">'+(CATLBL[s.cat]||s.cat)+'</div>';
      lastCat=s.cat;
    }
    html+='<div class="subcard'+(s.paused?' paused':'')+'" onclick="openDetail(\''+s.id+'\')">'
      +iconHTML(s)
      +'<div class="sinfo"><div class="sname">'+s.name+'</div><div class="ssub">'+(s.paused?'in pausa':'rinnovo '+fmtShort(s.renewal))+'</div></div>'
      +'<div class="sright"><div class="scost">€'+s.cost.toFixed(2)+'</div><div class="sfreq">'+(s.freq==='monthly'?'mensile':'annuale')+'</div></div>'
      +'</div>';
  });
  document.getElementById('listcont').innerHTML=html;
}

// ─── CALENDAR ────────────────────────────────────────────────────────────────
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=null;

function calMove(dir){
  calM+=dir;
  if(calM>11){calM=0;calY++;}
  if(calM<0){calM=11;calY--;}
  calSel=null;
  drawCalendar();
}

function drawCalendar(){
  // Month label
  document.getElementById('calmonth').textContent=
    MSLONG[calM].charAt(0).toUpperCase()+MSLONG[calM].slice(1)+' '+calY;

  // Map day -> subs
  const byDay={};
  subs.filter(s=>!s.paused).forEach(s=>{
    const d=new Date(s.renewal);
    if(d.getFullYear()===calY && d.getMonth()===calM){
      const day=d.getDate();
      if(!byDay[day]) byDay[day]=[];
      byDay[day].push(s);
    }
  });

  const today=new Date(); today.setHours(0,0,0,0);
  const todayN=(today.getFullYear()===calY && today.getMonth()===calM) ? today.getDate() : -1;
  const firstDow=new Date(calY,calM,1).getDay(); // 0=Sun
  const offset=firstDow===0?6:firstDow-1;        // Mon-based offset
  const daysInMonth=new Date(calY,calM+1,0).getDate();

  let html='';
  for(let i=0;i<offset;i++) html+='<div></div>';

  for(let d=1;d<=daysInMonth;d++){
    const has=!!byDay[d];
    const isToday=d===todayN;
    const isSel=d===calSel;
    const dow=new Date(calY,calM,d).getDay();
    const isSun=dow===0;

    let cls='calday';
    if(has) cls+=' has';
    if(isToday && !isSel) cls+=' today';
    if(isSel) cls+=' sel';
    if(isSun) cls+=' sun';

    const fw=isToday||isSel?700:400;
    let dots='';
    if(has){
      const cats=[...new Set(byDay[d].map(s=>s.cat))].slice(0,3);
      dots='<div class="caldots">'+cats.map(c=>'<div class="caldot" style="background:'+(CATCOL[c]||CATCOL.alt)+'"></div>').join('')+'</div>';
    }

    html+='<div class="'+cls+'" '+(has?'onclick="calClick('+d+')"':'')+'>'
      +'<span class="caldaynum" style="font-weight:'+fw+'">'+d+'</span>'
      +dots+'</div>';
  }
  document.getElementById('calgrid').innerHTML=html;

  // Detail panel
  const det=document.getElementById('caldetail');
  if(calSel && byDay[calSel]){
    const items=byDay[calSel];
    det.innerHTML='<div class="caldetail">'
      +'<div class="caldetail-hd">'+calSel+' '+MSLONG[calM]+' '+calY+'</div>'
      +items.map(s=>'<div class="rrow" style="padding:12px 16px" onclick="openDetail(\''+s.id+'\')">'
        +iconHTML(s,36)
        +'<div class="rinfo" style="margin-left:10px"><div class="rname">'+s.name+'</div><div class="rtag">'+badge(s)+'</div></div>'
        +'<div><div class="ramount">€'+s.cost.toFixed(2)+'</div><div class="rfreq">'+(s.freq==='monthly'?'mensile':'annuale')+'</div></div>'
        +'</div>').join('')
      +'</div>';
  } else {
    det.innerHTML='';
  }
}

function calClick(d){
  calSel = calSel===d ? null : d;
  drawCalendar();
}

function drawBarChart(){
  const today=new Date();

    months.push({y:d.getFullYear(), m:d.getMonth(), lbl:MSSHORT[d.getMonth()]+"'"+String(d.getFullYear()).slice(2)});
  }
  const vals=months.map(mo=>paylog.filter(h=>{ const d=new Date(h.date); return d.getFullYear()===mo.y&&d.getMonth()===mo.m; }).reduce((a,h)=>a+h.amount,0));
  if(barChart){barChart.destroy();barChart=null;}
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  barChart=new Chart(document.getElementById('barchart').getContext('2d'),{
    type:'bar',
    data:{labels:months.map(m=>m.lbl), datasets:[{data:vals, backgroundColor:dark?'rgba(255,255,255,.15)':'rgba(0,0,0,.12)', borderRadius:6, hoverBackgroundColor:'#D85A30'}]},

      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>' €'+c.parsed.y.toFixed(2)}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10}}}, y:{grid:{color:dark?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)'},ticks:{callback:v=>'€'+v,font:{size:10}}}}}
  });

    +'<div class="mactions">'
    +'<button class="btn" onclick="document.getElementById(\'det-ov\').remove();openEdit(\''+s.id+'\')"><span style="font-size:inherit;">✎</span> Modifica</button>'
    +'<button class="btn '+(s.paused?'bgrn2':'bora2')+'" onclick="quickPause(\''+s.id+'\')">'+(s.paused?'▶ Riattiva':'⏸ Pausa')+'</button>'
    +'</div></div></div>';
  document.body.appendChild(ov);
}

function quickPause(id){
  const s=subs.find(x=>x.id===id); if(!s) return;
  s.paused=!s.paused; saveAll();
  document.getElementById('det-ov')?.remove();
  drawAll();
}

// ─── ADD / EDIT ──────────────────────────────────────────────────────────────
let selColor=0;

function buildColorPicker(){
  document.getElementById('cpick').innerHTML=ICONCOL.map((c,i)=>
    '<div class="cdot" style="background:'+c.bg+';border:2px solid '+(i===selColor?'var(--tx)':'transparent')+'" onclick="pickColor('+i+')">'
    +'<span style="color:'+c.fg+';font-size:14px">★</span></div>'
  ).join('');
}
function pickColor(i){ selColor=i; buildColorPicker(); }

function openAdd(){
  editingId=null; selColor=0;
  document.getElementById('f-name').value='';
  document.getElementById('f-cost').value='';
  document.getElementById('f-freq').value='monthly';
  document.getElementById('f-notif').value='1';
  document.getElementById('f-cat').value='int';
  document.getElementById('f-icon').value='ti-device-tv';
  const nd=new Date(); nd.setMonth(nd.getMonth()+1);
  document.getElementById('f-date').value=nd.toISOString().split('T')[0];
  document.getElementById('editbtns').style.display='none';
  buildColorPicker();
  showPage('add',-1);
}

function openEdit(id){
  const s=subs.find(x=>x.id===id); if(!s) return;
  editingId=id; selColor=s.ci||0;
  document.getElementById('f-name').value=s.name;
  document.getElementById('f-cost').value=s.cost;
  document.getElementById('f-freq').value=s.freq;
  document.getElementById('f-date').value=s.renewal;
  document.getElementById('f-cat').value=s.cat;
  document.getElementById('f-notif').value=s.nd||1;
  document.getElementById('f-icon').value=s.icon;
  const eb=document.getElementById('editbtns');
  eb.style.display='flex';
  document.getElementById('pausebtn').className='btn '+(s.paused?'bgrn2':'bora2');
  document.getElementById('pauselbl').textContent=s.paused?'Riattiva abbonamento':'Metti in pausa';
  buildColorPicker();
  showPage('add',-1);
}

function cancelAdd(){
  editingId=null;
  const pages=['overview','list','calendar','history'];
  showPage(pages[prevPageIdx]||'overview', prevPageIdx);
}

function saveSub(){
  const name=document.getElementById('f-name').value.trim();
  const cost=parseFloat(document.getElementById('f-cost').value);
  const freq=document.getElementById('f-freq').value;
  const date=document.getElementById('f-date').value;
  const cat=document.getElementById('f-cat').value;
  const icon=document.getElementById('f-icon').value;
  const nd=parseInt(document.getElementById('f-notif').value)||1;
  if(!name||isNaN(cost)||cost<=0||!date){ alert('Compila tutti i campi.'); return; }
  if(editingId){
    const idx=subs.findIndex(x=>x.id===editingId);
    if(idx>=0) subs[idx]={...subs[idx], name, cost, freq, renewal:date, cat, icon, ci:selColor, nd};
  } else {
    subs.push({id:Date.now().toString(), name, cost, freq, renewal:date, cat, icon, ci:selColor, nd, paused:false});
  }
  saveAll(); cancelAdd();
}

function togglePause(){
  if(!editingId) return;
  const s=subs.find(x=>x.id===editingId); if(!s) return;
  s.paused=!s.paused; saveAll();
  document.getElementById('pausebtn').className='btn '+(s.paused?'bgrn2':'bora2');
  document.getElementById('pauselbl').textContent=s.paused?'Riattiva abbonamento':'Metti in pausa';
}

function deleteSub(){
  if(!editingId) return;
  const s=subs.find(x=>x.id===editingId);
  if(s && confirm('Eliminare "'+s.name+'"?')){
    subs=subs.filter(x=>x.id!==editingId);
    saveAll(); editingId=null; cancelAdd();
  }
}

// ─── EXPORT ──────────────────────────────────────────────────────────────────
function openExport(){
  const ov=document.createElement('div');
  ov.className='overlay on'; ov.id='exp-ov';
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML='<div class="modal"><div class="mhandle"></div>'
    +'<div class="mhead"><div class="mtitle">Esporta</div></div>'
    +'<div class="mbody" style="display:flex;flex-direction:column;gap:10px">'
    +'<button class="btn bpri" onclick="exportCSV()"><span style="font-size:inherit;">CSV</span> Esporta come CSV</button>'
    +'<button class="btn" onclick="exportJSON()"><span style="font-size:inherit;">JSON</span> Backup JSON</button>'
    +'<button class="btn" onclick="document.getElementById(\'exp-ov\').remove()">Chiudi</button>'
    +'</div></div>';
  document.body.appendChild(ov);
}

function exportCSV(){
  const active=subs.filter(s=>!s.paused);
  const rows=[['Nome','Costo','Frequenza','Mensile','Prossimo rinnovo','Categoria']];
  active.forEach(s=>rows.push([s.name, s.cost.toFixed(2), s.freq==='monthly'?'Mensile':'Annuale', mthly(s).toFixed(2), s.renewal, CATLBL[s.cat]||s.cat]));
  const tot=active.reduce((a,s)=>a+mthly(s),0);
  rows.push([],[' TOTALE MENSILE','','',''+tot.toFixed(2),'','']);
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  dl('abbonamenti.csv','data:text/csv;charset=utf-8,'+encodeURIComponent(csv));
}
function exportJSON(){ dl('abbonamenti_backup.json','data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({subs,paylog},null,2))); }
function dl(name,url){ const a=document.createElement('a'); a.href=url; a.download=name; a.click(); }

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function openSettings(){
  const perm='Notification' in window ? Notification.permission : 'unsupported';
  const permLbl={granted:'✅ Abilitato',denied:'❌ Bloccato',default:'⏳ Non richiesto',unsupported:'Non supportato'}[perm]||perm;
  const ov=document.createElement('div');
  ov.className='overlay on'; ov.id='cfg-ov';
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML='<div class="modal"><div class="mhandle"></div>'
    +'<div class="mhead"><div class="mtitle">Impostazioni</div></div>'
    +'<div class="mbody">'
    +'<div class="stitle" style="margin-top:0">Notifiche</div>'
    +'<div class="drow"><span class="dlabel">Permesso</span><span class="dval">'+permLbl+'</span></div>'
    +'<div class="drow" style="flex-direction:column;align-items:flex-start;gap:10px">'
    +'<span class="dlabel">Avvisi rinnovi push</span>'
    +'<label style="display:flex;align-items:center;gap:10px;cursor:pointer">'
    +'<span class="toggle"><input type="checkbox" id="cfg-notif" '+(cfg.notif?'checked':'')+' ><span class="tslider"></span></span>'
    +'<span style="font-size:14px">Attiva notifiche</span></label></div>'
    +'<div class="stitle">Budget mensile</div>'
    +'<div class="drow" style="flex-direction:column;align-items:flex-start;gap:10px">'
    +'<label style="display:flex;align-items:center;gap:10px;cursor:pointer">'
    +'<span class="toggle"><input type="checkbox" id="cfg-budon" '+(cfg.budgetOn?'checked':'')+' ><span class="tslider"></span></span>'
    +'<span style="font-size:14px">Attiva budget</span></label>'
    +'<input class="finput" type="number" id="cfg-budamt" value="'+(cfg.budget||300)+'" placeholder="es. 300" min="0"></div>'
    +'<div class="mactions" style="margin-top:20px">'
    +'<button class="btn" onclick="document.getElementById(\'cfg-ov\').remove()">Chiudi</button>'
    +'<button class="btn bpri" onclick="saveSettings()">Salva</button></div>'
    +'<button class="btn" style="width:100%;margin-top:10px;color:var(--tx2)" onclick="testNotif()"><span style="font-size:inherit;">🔔</span> Notifica di prova</button>'
    +'</div></div>';
  document.body.appendChild(ov);
}

async function saveSettings(){
  const notifToggle=document.getElementById('cfg-notif');
  if(notifToggle?.checked && 'Notification' in window && Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted'){ notifToggle.checked=false; }
  }
  cfg.notif=document.getElementById('cfg-notif')?.checked||false;
  cfg.budgetOn=document.getElementById('cfg-budon')?.checked||false;
  cfg.budget=parseFloat(document.getElementById('cfg-budamt')?.value)||0;
  cfg.lastCheck=null;
  saveAll();
  document.getElementById('cfg-ov')?.remove();
  updateNotifBtn();
  drawOverview();
  if(cfg.notif) checkNotifs();
}

function sendNotif(title,body){
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title,{body}); }catch(e){}
  }
}
async function testNotif(){
  if('Notification' in window && Notification.permission!=='granted') await Notification.requestPermission();
  sendNotif('🔔 Prova','Le notifiche funzionano correttamente!');
}
function checkNotifs(){
  if(!cfg.notif || !('Notification' in window) || Notification.permission!=='granted') return;
  const today=new Date(); today.setHours(0,0,0,0);
  const ts=today.toISOString().split('T')[0];
  if(cfg.lastCheck===ts) return;
  subs.filter(s=>!s.paused).forEach(s=>{
    const d=daysTo(s.renewal);
    if(d>=0 && d<=(s.nd||1)) sendNotif('🔔 Rinnovo imminente',s.name+' — €'+s.cost.toFixed(2)+' tra '+d+' giorno/i');
  });
  cfg.lastCheck=ts; saveAll();
}
function updateNotifBtn(){
  const btn=document.getElementById('notifbtn'); if(!btn) return;
  btn.style.color=cfg.notif&&'Notification' in window&&Notification.permission==='granted'?'var(--grn)':'var(--tx)';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
function drawAll(){ drawOverview(); drawList(); drawCalendar(); drawHistory(); }

updateNotifBtn();
checkNotifs();
drawAll();
</script>
</body>
</html>
