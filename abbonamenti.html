<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abbonamenti">
<meta name="theme-color" content="#ffffff">
<title>Abbonamenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #efefeb;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #a0a09c;
    --accent: #2a2a28;
    --accent-light: #e8e7e2;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --danger: #c94040;
    --danger-bg: #fdf0f0;
    --warn: #b06a10;
    --warn-bg: #fdf3e7;
    --ok: #2a7a4a;
    --ok-bg: #edf7f1;
    --r: 14px;
    --r-sm: 8px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --nav-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --surface2: #2e2e2b;
      --text: #f0efe9;
      --text2: #9a9a94;
      --text3: #5a5a56;
      --accent: #e8e7e2;
      --accent-light: #2e2e2b;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --danger: #e06060;
      --danger-bg: #2d1e1e;
      --warn: #d08030;
      --warn-bg: #2d2215;
      --ok: #4aaa6a;
      --ok-bg: #162a20;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overscroll-behavior: none;
  }
  #app { padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }

  /* NAV */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 56px;
  }
  .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* TAB BAR */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    background: none; border: none; cursor: pointer;
    color: var(--text3);
    font-family: var(--font);
    font-size: 11px;
    padding-top: 8px;
    transition: color 0.15s;
  }
  .tab-btn i { font-size: 22px; }
  .tab-btn.active { color: var(--text); }
  .tab-btn.active i { font-weight: 600; }

  /* PAGES */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* METRIC GRID */
  .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
  .metric {
    background: var(--surface);
    border-radius: var(--r);
    padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .metric-label { font-size: 11px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* CHART CARD */
  .chart-card {
    background: var(--surface);
    border-radius: var(--r);
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 20px;
  }
  .chart-card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 14px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* SECTION TITLE */
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin: 20px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* SUB CARD */
  .sub-card {
    background: var(--surface);
    border-radius: var(--r);
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }
  .sub-card:active { background: var(--surface2); }
  .sub-icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .sub-info { flex: 1; min-width: 0; }
  .sub-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-renewal { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .sub-right { text-align: right; flex-shrink: 0; }
  .sub-cost { font-size: 15px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.02em; }
  .sub-freq { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* BADGES */
  .badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 20px; letter-spacing: 0.02em;
  }
  .badge-urgent { background: var(--danger-bg); color: var(--danger); }
  .badge-soon { background: var(--warn-bg); color: var(--warn); }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-annual { background: var(--accent-light); color: var(--text2); }

  /* RENEWAL ROW */
  .renewal-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }
  .renewal-row:last-child { border-bottom: none; }
  .renewal-date-box {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--surface2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .renewal-day { font-size: 16px; font-weight: 600; line-height: 1; font-family: var(--mono); }
  .renewal-month { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-top: 1px; }
  .renewal-info { flex: 1; min-width: 0; }
  .renewal-name { font-size: 14px; font-weight: 500; }
  .renewal-tag { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .renewal-right { text-align: right; flex-shrink: 0; }
  .renewal-amount { font-size: 14px; font-weight: 600; font-family: var(--mono); }

  /* MODAL OVERLAY */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 90dvh;
    overflow-y: auto;
    padding: 0 0 calc(20px + var(--safe-bottom));
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 16px; }
  .modal-header { padding: 0 20px 16px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .modal-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .modal-body { padding: 20px; }
  .modal-detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .modal-detail-row:last-child { border-bottom: none; }
  .modal-detail-label { font-size: 13px; color: var(--text2); }
  .modal-detail-value { font-size: 13px; font-weight: 500; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; height: 48px; border-radius: var(--r-sm);
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text2); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; height: 46px; padding: 0 14px;
    border: 1px solid var(--border2); border-radius: var(--r-sm);
    background: var(--surface2); color: var(--text);
    font-family: var(--font); font-size: 15px;
    outline: none;
  }
  .form-input:focus { border-color: var(--text); }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  select.form-input { appearance: none; }

  /* ADD FORM PAGE */
  .add-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .color-dot {
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .color-dot.selected { border-color: var(--text); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 48px 24px; color: var(--text3); }
  .empty i { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }

  /* NOTIFICATION BANNER */
  .notif-banner {
    background: var(--warn-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .notif-banner i { color: var(--warn); font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .notif-text { font-size: 13px; color: var(--text); line-height: 1.5; }
  .notif-text strong { font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <span class="nav-title" id="nav-title">Abbonamenti</span>
    <button class="nav-btn" id="add-btn" onclick="openAddModal()" aria-label="Aggiungi abbonamento">
      <i class="ti ti-plus"></i>
    </button>
  </nav>

  <!-- OVERVIEW PAGE -->
  <div class="page active" id="page-overview">
    <div id="notif-container"></div>
    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">Mensile</div>
        <div class="metric-value" id="metric-monthly">—</div>
        <div class="metric-sub">spesa totale</div>
      </div>
      <div class="metric">
        <div class="metric-label">Annuale</div>
        <div class="metric-value" id="metric-annual">—</div>
        <div class="metric-sub">proiezione</div>
      </div>
      <div class="metric">
        <div class="metric-label">Totale</div>
        <div class="metric-value" id="metric-count">—</div>
        <div class="metric-sub">abbonamenti attivi</div>
      </div>
      <div class="metric">
        <div class="metric-label">Più costoso</div>
        <div class="metric-value" id="metric-top" style="font-size:16px;padding-top:4px">—</div>
        <div class="metric-sub" id="metric-top-cost"></div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">Ripartizione per categoria</div>
      <div style="position:relative;height:200px;"><canvas id="pieChart" role="img" aria-label="Grafico ripartizione spese per categoria"></canvas></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>
    <div class="section-title">Prossimi rinnovi</div>
    <div id="upcoming-list"></div>
  </div>

  <!-- LIST PAGE -->
  <div class="page" id="page-list">
    <div id="cat-list"></div>
  </div>

  <!-- CALENDAR PAGE -->
  <div class="page" id="page-calendar">
    <div style="background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:4px 6px;">
      <div id="calendar-list"></div>
    </div>
  </div>

  <!-- ADD/EDIT PAGE -->
  <div class="page" id="page-add">
    <div class="form-group">
      <label class="form-label">Nome servizio</label>
      <input class="form-input" type="text" id="f-name" placeholder="es. Netflix">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Costo (€)</label>
        <input class="form-input" type="number" id="f-cost" placeholder="9.99" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Frequenza</label>
        <select class="form-input" id="f-freq">
          <option value="monthly">Mensile</option>
          <option value="annual">Annuale</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Prossimo rinnovo</label>
      <input class="form-input" type="date" id="f-date">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-input" id="f-cat">
        <option value="intrattenimento">Intrattenimento</option>
        <option value="ai">AI & Produttività</option>
        <option value="cloud">Cloud & Utility</option>
        <option value="fitness">Fitness & Salute</option>
        <option value="telefonia">Telefonia</option>
        <option value="finanza">Finanza</option>
        <option value="altro">Altro</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Colore icona</label>
      <div class="color-picker-row" id="color-picker"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Icona</label>
      <select class="form-input" id="f-icon">
        <option value="ti-device-tv">TV / Streaming</option>
        <option value="ti-music">Musica</option>
        <option value="ti-ball-football">Sport</option>
        <option value="ti-brain">AI / Assistente</option>
        <option value="ti-robot">Chatbot</option>
        <option value="ti-microphone">Trascrizione</option>
        <option value="ti-pencil">Design / Grafica</option>
        <option value="ti-cloud">Cloud Storage</option>
        <option value="ti-brand-apple">Apple</option>
        <option value="ti-brand-google">Google</option>
        <option value="ti-camera">Sicurezza</option>
        <option value="ti-apple">Salute / Cibo</option>
        <option value="ti-moon">Meditazione</option>
        <option value="ti-phone">Telefonia</option>
        <option value="ti-credit-card">Finanza / Banca</option>
        <option value="ti-shopping-bag">Shopping</option>
        <option value="ti-news">Notizie</option>
        <option value="ti-device-gamepad">Gaming</option>
        <option value="ti-school">Formazione</option>
        <option value="ti-heart-rate-monitor">Fitness</option>
        <option value="ti-star">Altro</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn" onclick="cancelAdd()">Annulla</button>
      <button class="btn btn-primary" onclick="saveSubscription()" id="save-btn">Salva</button>
    </div>
    <div id="delete-container" style="margin-top:12px;display:none;">
      <button class="btn btn-danger" style="width:100%;" onclick="deleteCurrentSub()"><i class="ti ti-trash"></i> Elimina abbonamento</button>
    </div>
  </div>
</div>

<!-- BOTTOM TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="showPage('overview',this)" aria-label="Riepilogo">
    <i class="ti ti-chart-pie"></i>
    <span>Riepilogo</span>
  </button>
  <button class="tab-btn" onclick="showPage('list',this)" aria-label="Lista">
    <i class="ti ti-list"></i>
    <span>Lista</span>
  </button>
  <button class="tab-btn" onclick="showPage('calendar',this)" aria-label="Rinnovi">
    <i class="ti ti-calendar-event"></i>
    <span>Rinnovi</span>
  </button>
</nav>

<script>
const CAT_COLORS = {
  intrattenimento: '#D85A30',
  ai: '#7F77DD',
  cloud: '#378ADD',
  fitness: '#1D9E75',
  telefonia: '#BA7517',
  finanza: '#888780',
  altro: '#5DCAA5'
};
const CAT_LABELS = {
  intrattenimento: 'Intrattenimento',
  ai: 'AI & Produttività',
  cloud: 'Cloud & Utility',
  fitness: 'Fitness & Salute',
  telefonia: 'Telefonia',
  finanza: 'Finanza',
  altro: 'Altro'
};
const ICON_COLORS = [
  {bg:'#FAECE7',fg:'#D85A30'},{bg:'#EEEDFE',fg:'#534AB7'},{bg:'#E6F1FB',fg:'#185FA5'},
  {bg:'#E1F5EE',fg:'#0F6E56'},{bg:'#FAEEDA',fg:'#854F0B'},{bg:'#F1EFE8',fg:'#5F5E5A'},
  {bg:'#FBEAF0',fg:'#993556'},{bg:'#EAF3DE',fg:'#3B6D11'}
];

const DEFAULT_SUBS = [
  {id:'1',name:'Netflix Premium',cost:19.99,freq:'monthly',renewal:'2026-06-16',cat:'intrattenimento',icon:'ti-device-tv',colorIdx:0},
  {id:'2',name:'Amazon Prime',cost:49.90,freq:'annual',renewal:'2026-07-07',cat:'intrattenimento',icon:'ti-shopping-bag',colorIdx:0},
  {id:'3',name:'DAZN Full',cost:52.49,freq:'monthly',renewal:'2026-06-25',cat:'intrattenimento',icon:'ti-ball-football',colorIdx:0},
  {id:'4',name:'Wind (personale)',cost:15.98,freq:'monthly',renewal:'2026-06-05',cat:'telefonia',icon:'ti-phone',colorIdx:4},
  {id:'5',name:'Yazio Pro',cost:29.90,freq:'annual',renewal:'2026-05-22',cat:'fitness',icon:'ti-apple',colorIdx:3},
  {id:'6',name:'Apple One Famiglia',cost:25.95,freq:'monthly',renewal:'2026-05-30',cat:'cloud',icon:'ti-brand-apple',colorIdx:2},
  {id:'7',name:'Balance Meditation',cost:44.99,freq:'annual',renewal:'2026-07-27',cat:'fitness',icon:'ti-moon',colorIdx:3},
  {id:'8',name:'ChatGPT Plus',cost:22.99,freq:'monthly',renewal:'2026-05-22',cat:'ai',icon:'ti-robot',colorIdx:1},
  {id:'9',name:'Claude Pro',cost:22.00,freq:'monthly',renewal:'2026-05-23',cat:'ai',icon:'ti-brain',colorIdx:1},
  {id:'10',name:'Disney+ Premium',cost:15.99,freq:'monthly',renewal:'2026-06-02',cat:'intrattenimento',icon:'ti-device-tv',colorIdx:0},
  {id:'11',name:'eufy Cloud',cost:3.99,freq:'monthly',renewal:'2026-06-15',cat:'cloud',icon:'ti-camera',colorIdx:2},
  {id:'12',name:'iCloud+ 2TB',cost:9.99,freq:'monthly',renewal:'2026-06-01',cat:'cloud',icon:'ti-cloud',colorIdx:2},
  {id:'13',name:'Morpholio Trace',cost:19.99,freq:'annual',renewal:'2027-01-19',cat:'ai',icon:'ti-pencil',colorIdx:1},
  {id:'14',name:'Otter Premium',cost:99.99,freq:'annual',renewal:'2027-03-27',cat:'ai',icon:'ti-microphone',colorIdx:1},
  {id:'15',name:'Google One',cost:19.99,freq:'annual',renewal:'2026-09-10',cat:'cloud',icon:'ti-brand-google',colorIdx:2},
  {id:'16',name:'Paramount+',cost:7.99,freq:'monthly',renewal:'2026-06-13',cat:'intrattenimento',icon:'ti-device-tv',colorIdx:0},
  {id:'17',name:'Revolut Metal',cost:15.99,freq:'monthly',renewal:'2026-05-28',cat:'finanza',icon:'ti-credit-card',colorIdx:5}
];

let subs = [];
let pieChart = null;
let editingId = null;
let selectedColor = 0;

function loadData() {
  try {
    const raw = localStorage.getItem('subs_v2');
    if (raw) { subs = JSON.parse(raw); }
    else { subs = DEFAULT_SUBS; saveData(); }
  } catch(e) { subs = DEFAULT_SUBS; }
}
function saveData() {
  try { localStorage.setItem('subs_v2', JSON.stringify(subs)); } catch(e){}
}

function monthlyEq(s) {
  if (s.freq === 'monthly') return s.cost;
  return +(s.cost / 12).toFixed(4);
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  const months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  return d.getDate() + ' ' + months[d.getMonth()];
}
function fmtDateFull(dateStr) {
  const d = new Date(dateStr);
  const months = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function badgeForDays(days, freq) {
  if (freq === 'annual') return `<span class="badge badge-annual">annuale</span>`;
  if (days < 0) return `<span class="badge badge-urgent">scaduto</span>`;
  if (days === 0) return `<span class="badge badge-urgent">oggi</span>`;
  if (days <= 7) return `<span class="badge badge-urgent">${days}g</span>`;
  if (days <= 14) return `<span class="badge badge-soon">${days}g</span>`;
  return `<span class="badge badge-ok">${days}g</span>`;
}

function renderOverview() {
  const total = subs.reduce((a,s) => a + monthlyEq(s), 0);
  document.getElementById('metric-monthly').textContent = '€' + total.toFixed(2);
  document.getElementById('metric-annual').textContent = '€' + Math.round(total * 12).toLocaleString('it-IT');
  document.getElementById('metric-count').textContent = subs.length;
  const top = subs.slice().sort((a,b) => monthlyEq(b)-monthlyEq(a))[0];
  if (top) {
    document.getElementById('metric-top').textContent = top.name;
    document.getElementById('metric-top-cost').textContent = '€' + top.cost.toFixed(2) + '/' + (top.freq==='monthly'?'mese':'anno');
  }

  // Notifications
  const notifContainer = document.getElementById('notif-container');
  const urgents = subs.filter(s => { const d = daysUntil(s.renewal); return d >= 0 && d <= 7; })
    .sort((a,b) => daysUntil(a.renewal)-daysUntil(b.renewal));
  if (urgents.length > 0) {
    const names = urgents.map(s => `<strong>${s.name}</strong>`).join(', ');
    notifContainer.innerHTML = `<div class="notif-banner"><i class="ti ti-bell-ringing"></i><div class="notif-text">Rinnovi imminenti (entro 7 giorni): ${names}</div></div>`;
  } else {
    notifContainer.innerHTML = '';
  }

  // Pie chart
  const catTotals = {};
  subs.forEach(s => { catTotals[s.cat] = (catTotals[s.cat]||0) + monthlyEq(s); });
  const cats = Object.keys(catTotals);
  const vals = cats.map(c => +catTotals[c].toFixed(2));
  const colors = cats.map(c => CAT_COLORS[c] || CAT_COLORS.altro);

  if (pieChart) { pieChart.destroy(); pieChart = null; }
  const ctx = document.getElementById('pieChart').getContext('2d');
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: cats.map(c => CAT_LABELS[c]||c), datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' €' + ctx.parsed.toFixed(2) + '/mese' } } }
    }
  });
  const leg = document.getElementById('chart-legend');
  leg.innerHTML = cats.map((c,i) => `<span class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${CAT_LABELS[c]||c}</span>`).join('');

  // Upcoming
  const upcoming = subs.slice().sort((a,b) => new Date(a.renewal)-new Date(b.renewal)).slice(0,6);
  const ul = document.getElementById('upcoming-list');
  if (upcoming.length === 0) { ul.innerHTML = '<div class="empty"><i class="ti ti-calendar-off"></i><div class="empty-title">Nessun rinnovo</div></div>'; return; }
  ul.innerHTML = upcoming.map(s => {
    const days = daysUntil(s.renewal);
    const c = ICON_COLORS[s.colorIdx||0];
    return `<div class="renewal-row" onclick="openDetail('${s.id}')">
      <div class="renewal-date-box">
        <span class="renewal-day">${new Date(s.renewal).getDate()}</span>
        <span class="renewal-month">${['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][new Date(s.renewal).getMonth()]}</span>
      </div>
      <div class="renewal-info">
        <div class="renewal-name">${s.name}</div>
        <div class="renewal-tag">${badgeForDays(days, s.freq)}</div>
      </div>
      <div class="renewal-right">
        <div class="renewal-amount">€${s.freq==='annual'?s.cost.toFixed(2):(s.cost.toFixed(2))}</div>
        <div style="font-size:11px;color:var(--text3)">${s.freq==='annual'?'annuale':'mensile'}</div>
      </div>
    </div>`;
  }).join('');
}

function renderList() {
  const grouped = {};
  subs.forEach(s => { if(!grouped[s.cat]) grouped[s.cat]=[]; grouped[s.cat].push(s); });
  const el = document.getElementById('cat-list');
  const catOrder = ['intrattenimento','ai','cloud','fitness','telefonia','finanza','altro'];
  let html = '';
  catOrder.forEach(cat => {
    if (!grouped[cat] || grouped[cat].length===0) return;
    html += `<div class="section-title">${CAT_LABELS[cat]||cat}</div>`;
    grouped[cat].forEach(s => {
      const c = ICON_COLORS[s.colorIdx||0];
      html += `<div class="sub-card" onclick="openDetail('${s.id}')">
        <div class="sub-icon" style="background:${c.bg}"><i class="ti ${s.icon}" style="color:${c.fg}"></i></div>
        <div class="sub-info">
          <div class="sub-name">${s.name}</div>
          <div class="sub-renewal">rinnovo ${fmtDate(s.renewal)}</div>
        </div>
        <div class="sub-right">
          <div class="sub-cost">€${s.cost.toFixed(2)}</div>
          <div class="sub-freq">${s.freq==='monthly'?'mensile':'annuale'}</div>
        </div>
      </div>`;
    });
  });
  if (!html) html = '<div class="empty"><i class="ti ti-inbox"></i><div class="empty-title">Nessun abbonamento</div><div class="empty-sub">Aggiungi il primo con il pulsante +</div></div>';
  el.innerHTML = html;
}

function renderCalendar() {
  const sorted = subs.slice().sort((a,b) => new Date(a.renewal)-new Date(b.renewal));
  const el = document.getElementById('calendar-list');
  if (sorted.length===0) { el.innerHTML='<div class="empty"><i class="ti ti-calendar"></i><div class="empty-title">Nessun rinnovo</div></div>'; return; }
  el.innerHTML = sorted.map(s => {
    const days = daysUntil(s.renewal);
    const d = new Date(s.renewal);
    const months = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
    return `<div class="renewal-row" onclick="openDetail('${s.id}')">
      <div class="renewal-date-box">
        <span class="renewal-day">${d.getDate()}</span>
        <span class="renewal-month">${months[d.getMonth()]}</span>
      </div>
      <div class="renewal-info">
        <div class="renewal-name">${s.name}</div>
        <div class="renewal-tag" style="margin-top:4px">${badgeForDays(days,s.freq)}</div>
      </div>
      <div class="renewal-right">
        <div class="renewal-amount">€${s.cost.toFixed(2)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${s.freq==='monthly'?'mensile':'annuale'}</div>
      </div>
    </div>`;
  }).join('');
}

function renderAll() { renderOverview(); renderList(); renderCalendar(); }

let currentDetailId = null;
function openDetail(id) {
  const s = subs.find(x=>x.id===id);
  if (!s) return;
  currentDetailId = id;
  const c = ICON_COLORS[s.colorIdx||0];
  const days = daysUntil(s.renewal);
  const monthly = monthlyEq(s);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.id = 'detail-overlay';
  overlay.onclick = (e) => { if(e.target===overlay) closeDetail(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="sub-icon" style="background:${c.bg};border-radius:12px;width:48px;height:48px;font-size:22px;"><i class="ti ${s.icon}" style="color:${c.fg}"></i></div>
          <div>
            <div class="modal-title">${s.name}</div>
            <div class="modal-sub">${CAT_LABELS[s.cat]||s.cat}</div>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-detail-row"><span class="modal-detail-label">Costo</span><span class="modal-detail-value" style="font-family:var(--mono);font-size:18px;font-weight:600">€${s.cost.toFixed(2)}</span></div>
        <div class="modal-detail-row"><span class="modal-detail-label">Frequenza</span><span class="modal-detail-value">${s.freq==='monthly'?'Mensile':'Annuale'}</span></div>
        <div class="modal-detail-row"><span class="modal-detail-label">Equivalente mensile</span><span class="modal-detail-value">€${monthly.toFixed(2)}/mese</span></div>
        <div class="modal-detail-row"><span class="modal-detail-label">Prossimo rinnovo</span><span class="modal-detail-value">${fmtDateFull(s.renewal)} ${badgeForDays(days,s.freq)}</span></div>
        <div class="modal-detail-row"><span class="modal-detail-label">Costo annuale</span><span class="modal-detail-value">€${(monthly*12).toFixed(2)}/anno</span></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeDetail();openEditModal('${s.id}')"><i class="ti ti-edit"></i> Modifica</button>
          <button class="btn btn-danger" onclick="closeDetail();confirmDelete('${s.id}')"><i class="ti ti-trash"></i> Elimina</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeDetail() {
  const el = document.getElementById('detail-overlay');
  if (el) el.remove();
}

function confirmDelete(id) {
  const s = subs.find(x=>x.id===id);
  if (!s) return;
  if (confirm(`Eliminare "${s.name}"?`)) {
    subs = subs.filter(x=>x.id!==id);
    saveData(); renderAll();
  }
}

let prevPage = 'overview';
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('nav-title').textContent = {overview:'Abbonamenti',list:'Lista',calendar:'Rinnovi',add: editingId?'Modifica':'Nuovo'}[name]||'Abbonamenti';
  document.getElementById('add-btn').style.display = name==='add' ? 'none' : 'flex';
  if (name !== 'add') prevPage = name;
}

function buildColorPicker() {
  const el = document.getElementById('color-picker');
  el.innerHTML = ICON_COLORS.map((c,i) => `<div class="color-dot${i===selectedColor?' selected':''}" style="background:${c.bg};border:2px solid ${i===selectedColor?'var(--text)':'transparent'}" onclick="selectColor(${i})"><i class="ti ti-star" style="color:${c.fg};font-size:13px"></i></div>`).join('');
}
function selectColor(i) {
  selectedColor = i;
  buildColorPicker();
}

function openAddModal() {
  editingId = null;
  selectedColor = 0;
  document.getElementById('f-name').value = '';
  document.getElementById('f-cost').value = '';
  document.getElementById('f-freq').value = 'monthly';
  const today = new Date(); today.setMonth(today.getMonth()+1);
  document.getElementById('f-date').value = today.toISOString().split('T')[0];
  document.getElementById('f-cat').value = 'intrattenimento';
  document.getElementById('f-icon').value = 'ti-device-tv';
  document.getElementById('delete-container').style.display = 'none';
  buildColorPicker();
  showPage('add', null);
}
function openEditModal(id) {
  const s = subs.find(x=>x.id===id);
  if (!s) return;
  editingId = id;
  selectedColor = s.colorIdx||0;
  document.getElementById('f-name').value = s.name;
  document.getElementById('f-cost').value = s.cost;
  document.getElementById('f-freq').value = s.freq;
  document.getElementById('f-date').value = s.renewal;
  document.getElementById('f-cat').value = s.cat;
  document.getElementById('f-icon').value = s.icon;
  document.getElementById('delete-container').style.display = 'block';
  buildColorPicker();
  showPage('add', null);
}
function cancelAdd() {
  editingId = null;
  showPage(prevPage, document.querySelector(`.tab-btn:nth-child(${prevPage==='overview'?1:prevPage==='list'?2:3})`));
  document.querySelector(`.tab-btn:nth-child(${prevPage==='overview'?1:prevPage==='list'?2:3})`).classList.add('active');
}
function saveSubscription() {
  const name = document.getElementById('f-name').value.trim();
  const cost = parseFloat(document.getElementById('f-cost').value);
  const freq = document.getElementById('f-freq').value;
  const date = document.getElementById('f-date').value;
  const cat = document.getElementById('f-cat').value;
  const icon = document.getElementById('f-icon').value;
  if (!name || isNaN(cost) || cost<=0 || !date) { alert('Compila tutti i campi obbligatori.'); return; }
  if (editingId) {
    const idx = subs.findIndex(x=>x.id===editingId);
    if (idx>=0) subs[idx] = {...subs[idx],name,cost,freq,renewal:date,cat,icon,colorIdx:selectedColor};
  } else {
    subs.push({id: Date.now().toString(), name, cost, freq, renewal:date, cat, icon, colorIdx:selectedColor});
  }
  saveData(); renderAll();
  cancelAdd();
}
function deleteCurrentSub() {
  if (!editingId) return;
  const s = subs.find(x=>x.id===editingId);
  if (s && confirm(`Eliminare "${s.name}"?`)) {
    subs = subs.filter(x=>x.id!==editingId);
    saveData(); renderAll();
    editingId = null;
    cancelAdd();
  }
}

loadData();
renderAll();
</script>
</body>
</html>
